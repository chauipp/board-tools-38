# Render Blueprint — must live at the repo root so Render auto-detects it.
# The app lives in game-tools/, so rootDir points Render there; the build/start
# commands are then relative to game-tools/.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> set the
# MONGODB_URI secret (Atlas connection string) -> Apply. Render builds the
# client, installs the server, and the server serves both the API and the
# built client on one free web service URL.
#
# Also required in MongoDB Atlas: Network Access -> allow 0.0.0.0/0 (Render's
# free tier has no static outbound IP).
services:
  - type: web
    name: game-tools
    runtime: node
    plan: free
    rootDir: game-tools
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      # Google Cloud Console OAuth client ID. Not secret (meant to be public/
      # embedded in frontend code) but set via dashboard since it doesn't
      # exist until the operator creates it — same value used by both the
      # client build (Vite auto-exposes VITE_-prefixed vars) and the server's
      # token-audience check.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      # NODE_ENV can't be "production" here: the build command runs
      # `npm install` for the client, and npm omits devDependencies under
      # NODE_ENV=production, which would delete vite/@lingui/cli and break
      # the build. So the session cookie's Secure flag is driven by this
      # var instead — not a secret, so a plain value.
      - key: COOKIE_SECURE
        value: "true"
      # Cloudflare R2 — where uploaded PDFs live. Without these four, PDFs fall
      # back to the server's local disk, which Render wipes on every redeploy;
      # that is exactly what R2 is here to prevent, so set all four in the
      # dashboard. Values come from the R2 bucket + an API token scoped to it
      # (Object Read & Write). See server/.env.example step 9.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Discord webhook for PDF storage alerts. Optional — leave unset and the
      # alerts only go to the Render logs.
      - key: DISCORD_WEBHOOK_URL
        sync: false
      # Node 22+ required: @lingui/cli imports fs.globSync, which does not
      # exist before Node 22 (build fails on 20 with a node:fs SyntaxError).
      - key: NODE_VERSION
        value: 22.11.0
